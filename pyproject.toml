[project]
name = "wagtail-streamfield-presets"
version = "0.1.0"
description = "Predefined sets of blocks that editors can load into a Wagtail StreamField."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
classifiers = [
    # Update this based on your project's status.
    # See: https://pypi.org/classifiers/
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Framework :: Wagtail",
    "Framework :: Wagtail :: 7",
    "Framework :: Wagtail :: 8",
]
# See: https://devguide.python.org/versions/#supported-versions
requires-python = ">=3.11"
dependencies = [
    # https://www.djangoproject.com/download/#supported-versions
    "django>=5.2",
    # https://github.com/wagtail/wagtail/wiki/Release-schedule
    # https://docs.wagtail.org/en/latest/releases/upgrading.html#compatible-django-python-versions
    "wagtail>=7.4",
]

[project.urls]
Homepage = "https://github.com/timonweb/wagtail-streamfield-presets"
Repository = "https://github.com/timonweb/wagtail-streamfield-presets"
Changelog = "https://github.com/timonweb/wagtail-streamfield-presets/blob/main/CHANGELOG.md"
Documentation = "https://github.com/timonweb/wagtail-streamfield-presets/tree/main/docs"
Issues = "https://github.com/timonweb/wagtail-streamfield-presets/issues"
# Add funding link if needed.
# Funding = "https://github.com/timonweb/wagtail-streamfield-presets"

[dependency-groups]
dev = [
    "dj-database-url>=3.1.2",
    "pytest>=8.1.1",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.12.0",
    "pytest-playwright>=0.7.0",
    "ruff>=0.15.9",
]

[build-system]
requires = ["uv_build>=0.12.6,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "wagtail_streamfield_presets"
source-exclude = [
    "wagtail_streamfield_presets/static_src",
    "wagtail_streamfield_presets/test",
    "testmanage.py",
    ".*",
    "*.json",
    "*.ini",
    "*.yml",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "wagtail_streamfield_presets.test.settings"
testpaths = ["tests"]
markers = ["browser: drives the editor in a real browser (needs `playwright install`)"]
